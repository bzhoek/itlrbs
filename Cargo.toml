[package]
name = "itlrbs"
version = "0.1.0"
edition = "2024"

[dependencies]
#rbsqlx = { git = "https://github.com/bzhoek/rbsqlx" }
rbsqlx = { path = "../rbsqlx" }
#id3rs = { git = "https://github.com/bzhoek/id3rs" }
id3rs = { path = "../id3rs" }

objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-itunes-library = "0.3.2"

anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
chrono = "0.4.42"
regex = "1.12.2"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.43"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
